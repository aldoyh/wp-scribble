<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Loading Scribbble...</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			text-align: center;
		}
		
		.loading-container {
			max-width: 400px;
			padding: 2rem;
		}
		
		.logo {
			font-size: 2.5rem;
			font-weight: 700;
			margin-bottom: 1rem;
			letter-spacing: -0.02em;
		}
		
		.spinner {
			width: 40px;
			height: 40px;
			margin: 2rem auto;
			border: 3px solid rgba(255, 255, 255, 0.3);
			border-top: 3px solid white;
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		
		.message {
			font-size: 1rem;
			opacity: 0.9;
			margin-bottom: 0.5rem;
		}
		
		.submessage {
			font-size: 0.875rem;
			opacity: 0.7;
		}
	</style>
</head>
<body>
	<div class="loading-container">
		<div class="logo">Scribbble</div>
		<div class="spinner"></div>
		<div class="message">Starting up...</div>
		<div class="submessage">Waiting for development server to be ready</div>
	</div>
</body>
</html>
